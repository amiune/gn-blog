<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Shopping List — App Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #F0FAF7;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    p { color: #475569; margin-bottom: 2rem; font-size: 0.95rem; }
    .icon-wrap { margin-bottom: 2rem; filter: drop-shadow(0 8px 24px rgba(45,155,131,0.3)); }
    .icon-wrap svg { display: block; width: 256px; height: 256px; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #2D9B83; color: #fff; }
    .btn-secondary { background: #E2E8F0; color: #1E293B; }
  </style>
</head>
<body>
  <h1>SB Shopping List</h1>
  <p>App Icon</p>

  <div class="icon-wrap">
    <svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3DBEA0"/>
          <stop offset="100%" stop-color="#1A7A65"/>
        </linearGradient>
        <linearGradient id="bagGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#F0F4F3"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <!-- Background -->
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Subtle pattern circles for depth -->
        <circle cx="180" cy="180" r="260" fill="#fff" opacity="0.04"/>
        <circle cx="880" cy="850" r="300" fill="#000" opacity="0.06"/>

        <!-- Left person -->
        <g opacity="1" transform="translate(-20 -20)">
          <circle cx="302" cy="262" r="66" fill="#fff" opacity="0.95"/>
          <path d="M190,520 L190,410 Q190,338 262,338 L342,338 Q414,338 414,410 L414,520 Z"
                fill="#fff" opacity="0.95"/>
        </g>

        <!-- Right person -->
        <g opacity="1" transform="translate(20 -20)">
          <circle cx="722" cy="262" r="66" fill="#fff" opacity="0.95"/>
          <path d="M610,520 L610,410 Q610,338 682,338 L762,338 Q834,338 834,410 L834,520 Z"
                fill="#fff" opacity="0.95"/>
        </g>

        <!-- Shared shopping bag -->
        <path d="M344,548 L344,832 Q344,872 384,872 L640,872 Q680,872 680,832 L680,548 Z"
              fill="url(#bagGrad)" opacity="0.97"/>

        <!-- Bag opening / rim -->
        <rect x="328" y="532" width="368" height="42" rx="14" fill="#fff"/>

        <!-- Bag handles -->
        <path d="M430,532 L430,474 Q430,430 474,430 L550,430 Q594,430 594,474 L594,532"
              fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>

        <!-- Checklist inside the bag -->
        <rect x="392" y="612" width="30" height="30" rx="8" fill="#2D9B83"/>
        <polyline points="399,628 407,637 421,616" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="442" y="619" width="176" height="11" rx="6" fill="#2D9B83" opacity="0.25"/>

        <rect x="392" y="674" width="30" height="30" rx="8" fill="#2D9B83"/>
        <polyline points="399,690 407,699 421,678" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="442" y="681" width="146" height="11" rx="6" fill="#2D9B83" opacity="0.25"/>

        <rect x="392" y="736" width="30" height="30" rx="8" fill="none" stroke="#2D9B83" stroke-width="4" opacity="0.5"/>
        <rect x="442" y="743" width="188" height="11" rx="6" fill="#2D9B83" opacity="0.15"/>

        <rect x="392" y="798" width="30" height="30" rx="8" fill="none" stroke="#2D9B83" stroke-width="4" opacity="0.5"/>
        <rect x="442" y="805" width="132" height="11" rx="6" fill="#2D9B83" opacity="0.15"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
    <button class="btn-secondary" onclick="downloadPNG(1024)">Download PNG 1024px</button>
  </div>

  <p style="margin-top: 2rem;">Without rounded corners</p>
  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG(true)">Download SVG (Square)</button>
    <button class="btn-secondary" onclick="downloadPNG(1024, true)">Download PNG 1024px (Square)</button>
  </div>

  <script>
    function getSvgData(square) {
      const svg = document.getElementById('app-icon').cloneNode(true);
      if (square) {
        const clipRect = svg.querySelector('#iosClip rect');
        if (clipRect) {
          clipRect.setAttribute('rx', '0');
          clipRect.setAttribute('ry', '0');
        }
      }
      return new XMLSerializer().serializeToString(svg);
    }

    function downloadSVG(square) {
      const svgData = getSvgData(square);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = square ? 'sbshoppinglist-icon-square.svg' : 'sbshoppinglist-icon.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function downloadPNG(size, square) {
      const svgData = getSvgData(square);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'sbshoppinglist-icon-' + size + (square ? '-square' : '') + '.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
