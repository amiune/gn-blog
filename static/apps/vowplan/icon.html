<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VowPlan — App Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #FBF6F8;
      color: #2A1A22;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    p { color: #5C4A52; margin-bottom: 2rem; font-size: 0.95rem; }
    .icon-wrap { margin-bottom: 2rem; filter: drop-shadow(0 8px 24px rgba(184,74,122,0.4)); }
    .icon-wrap svg { display: block; width: 256px; height: 256px; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #B84A7A; color: #fff; }
    .btn-secondary { background: #EDE4E8; color: #2A1A22; }
  </style>
</head>
<body>
  <h1>VowPlan</h1>
  <p>App icon — interlocking rings on accent #B84A7A</p>

  <div class="icon-wrap">
    <svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <rect width="1024" height="1024" fill="#B84A7A"/>

        <g fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round">
          <circle cx="410" cy="512" r="178"/>
          <circle cx="614" cy="512" r="178"/>
        </g>

        <path d="M292 420 A178 178 0 0 1 410 334"
              fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="28" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
    <button class="btn-secondary" onclick="downloadPNG(1024)">Download PNG 1024px</button>
  </div>

  <p style="margin-top: 2rem;">Without rounded corners</p>
  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG(true)">Download SVG (Square)</button>
    <button class="btn-secondary" onclick="downloadPNG(1024, true)">Download PNG 1024px (Square)</button>
  </div>

  <script>
    function getSvgData(square) {
      const svg = document.getElementById('app-icon').cloneNode(true);
      if (square) {
        const clipRect = svg.querySelector('#iosClip rect');
        if (clipRect) {
          clipRect.setAttribute('rx', '0');
          clipRect.setAttribute('ry', '0');
        }
      }
      return new XMLSerializer().serializeToString(svg);
    }

    function downloadSVG(square) {
      const svgData = getSvgData(square);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = square ? 'vowplan-icon-square.svg' : 'vowplan-icon.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function downloadPNG(size, square) {
      const svgData = getSvgData(square);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'vowplan-icon-' + size + (square ? '-square' : '') + '.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
