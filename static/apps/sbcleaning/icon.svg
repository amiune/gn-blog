<svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4C8FFA"/>
          <stop offset="100%" stop-color="#1E5FD6"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Todo list card -->
        <rect x="192" y="212" width="640" height="600" rx="56" fill="#FFFFFF"/>

        <!-- Row 1 — pending -->
        <circle cx="280" cy="340" r="32" fill="none" stroke="#D1D5DB" stroke-width="10"/>
        <rect x="360" y="316" width="400" height="48" rx="24" fill="#EEF2F8"/>

        <!-- Row 2 — pending -->
        <circle cx="280" cy="460" r="32" fill="none" stroke="#D1D5DB" stroke-width="10"/>
        <rect x="360" y="436" width="340" height="48" rx="24" fill="#EEF2F8"/>

        <!-- Row 3 — done (green sparkle) -->
        <g transform="translate(280 580)" fill="#34C759">
          <path d="M0-36 L10-10 L36 0 L10 10 L0 36 L-10 10 L-36 0 L-10-10 Z"/>
        </g>
        <rect x="360" y="556" width="380" height="48" rx="24" fill="#E8F5EC"/>

        <!-- Row 4 — done (green badge + white sparkle) -->
        <circle cx="280" cy="700" r="40" fill="#34C759"/>
        <g transform="translate(280 700)" fill="#FFFFFF">
          <path d="M0-28 L8-8 L28 0 L8 8 L0 28 L-8 8 L-28 0 L-8-8 Z"/>
        </g>
        <rect x="360" y="676" width="320" height="48" rx="24" fill="#E8F5EC"/>
