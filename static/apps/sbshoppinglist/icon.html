<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Shopping List — App Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #F0FAF7;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    p { color: #475569; margin-bottom: 2rem; font-size: 0.95rem; }
    .icon-wrap { margin-bottom: 2rem; filter: drop-shadow(0 8px 24px rgba(45,155,131,0.3)); }
    .icon-wrap svg { display: block; width: 256px; height: 256px; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #2D9B83; color: #fff; }
    .btn-secondary { background: #E2E8F0; color: #1E293B; }
  </style>
</head>
<body>
  <h1>SB Shopping List</h1>
  <p>App Icon</p>

  <div class="icon-wrap">
    <svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3DBEA0"/>
          <stop offset="100%" stop-color="#1A7A65"/>
        </linearGradient>
        <linearGradient id="bagGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#F0F4F3"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <!-- Background -->
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Subtle pattern circles for depth -->
        <circle cx="180" cy="180" r="260" fill="#fff" opacity="0.04"/>
        <circle cx="880" cy="850" r="300" fill="#000" opacity="0.06"/>

        <!-- Shopping bag body -->
        <path d="M280,420 L280,780 Q280,830 330,830 L694,830 Q744,830 744,780 L744,420 Z"
              fill="url(#bagGrad)" opacity="0.95"/>

        <!-- Bag opening / rim -->
        <rect x="260" y="400" width="504" height="50" rx="16" fill="#fff"/>

        <!-- Bag handles -->
        <path d="M390,400 L390,300 Q390,240 450,240 L574,240 Q634,240 634,300 L634,400"
              fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/>

        <!-- Checklist inside the bag -->

        <!-- Row 1 — checked -->
        <rect x="350" y="500" width="40" height="40" rx="10" fill="#2D9B83"/>
        <polyline points="359,522 369,534 389,506" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="420" y="508" width="240" height="14" rx="7" fill="#2D9B83" opacity="0.25"/>

        <!-- Row 2 — checked -->
        <rect x="350" y="580" width="40" height="40" rx="10" fill="#2D9B83"/>
        <polyline points="359,602 369,614 389,586" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="420" y="588" width="200" height="14" rx="7" fill="#2D9B83" opacity="0.25"/>

        <!-- Row 3 — unchecked -->
        <rect x="350" y="660" width="40" height="40" rx="10" fill="none" stroke="#2D9B83" stroke-width="5" opacity="0.5"/>
        <rect x="420" y="668" width="260" height="14" rx="7" fill="#2D9B83" opacity="0.15"/>

        <!-- Row 4 — unchecked -->
        <rect x="350" y="740" width="40" height="40" rx="10" fill="none" stroke="#2D9B83" stroke-width="5" opacity="0.5"/>
        <rect x="420" y="748" width="180" height="14" rx="7" fill="#2D9B83" opacity="0.15"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
    <button class="btn-secondary" onclick="downloadPNG(1024)">Download PNG 1024px</button>
  </div>

  <p style="margin-top: 2rem;">Without rounded corners</p>
  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG(true)">Download SVG (Square)</button>
    <button class="btn-secondary" onclick="downloadPNG(1024, true)">Download PNG 1024px (Square)</button>
  </div>

  <script>
    function getSvgData(square) {
      const svg = document.getElementById('app-icon').cloneNode(true);
      if (square) {
        const clipRect = svg.querySelector('#iosClip rect');
        if (clipRect) {
          clipRect.setAttribute('rx', '0');
          clipRect.setAttribute('ry', '0');
        }
      }
      return new XMLSerializer().serializeToString(svg);
    }

    function downloadSVG(square) {
      const svgData = getSvgData(square);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = square ? 'sbshoppinglist-icon-square.svg' : 'sbshoppinglist-icon.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function downloadPNG(size, square) {
      const svgData = getSvgData(square);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'sbshoppinglist-icon-' + size + (square ? '-square' : '') + '.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
