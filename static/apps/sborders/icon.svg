          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="0" ry="0"/>
        </clipPath>
      </defs>

