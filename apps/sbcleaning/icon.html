<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Job Tracker — App Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #F2F6FC;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    p { color: #475569; margin-bottom: 2rem; font-size: 0.95rem; }
    .icon-wrap { margin-bottom: 2rem; filter: drop-shadow(0 8px 24px rgba(52, 122, 249, 0.35)); }
    .icon-wrap svg { display: block; width: 256px; height: 256px; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #347AF9; color: #fff; }
    .btn-secondary { background: #E2E8F0; color: #1E293B; }
  </style>
</head>
<body>
  <h1>Clean Job Tracker</h1>
  <p>App icon — todo list with sparkle stars</p>

  <div class="icon-wrap">
    <svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4C8FFA"/>
          <stop offset="100%" stop-color="#1E5FD6"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Todo list card -->
        <rect x="192" y="212" width="640" height="600" rx="56" fill="#FFFFFF"/>

        <!-- Row 1 — pending -->
        <circle cx="280" cy="340" r="32" fill="none" stroke="#D1D5DB" stroke-width="10"/>
        <rect x="360" y="316" width="400" height="48" rx="24" fill="#EEF2F8"/>

        <!-- Row 2 — pending -->
        <circle cx="280" cy="460" r="32" fill="none" stroke="#D1D5DB" stroke-width="10"/>
        <rect x="360" y="436" width="340" height="48" rx="24" fill="#EEF2F8"/>

        <!-- Row 3 — done (green sparkle) -->
        <g transform="translate(280 580)" fill="#34C759">
          <path d="M0-36 L10-10 L36 0 L10 10 L0 36 L-10 10 L-36 0 L-10-10 Z"/>
        </g>
        <rect x="360" y="556" width="380" height="48" rx="24" fill="#E8F5EC"/>

        <!-- Row 4 — done (green badge + white sparkle) -->
        <circle cx="280" cy="700" r="40" fill="#34C759"/>
        <g transform="translate(280 700)" fill="#FFFFFF">
          <path d="M0-28 L8-8 L28 0 L8 8 L0 28 L-8 8 L-28 0 L-8-8 Z"/>
        </g>
        <rect x="360" y="676" width="320" height="48" rx="24" fill="#E8F5EC"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
    <button class="btn-secondary" onclick="downloadPNG(1024)">Download PNG 1024px</button>
  </div>

  <p style="margin-top: 2rem;">Without rounded corners</p>
  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG(true)">Download SVG (Square)</button>
    <button class="btn-secondary" onclick="downloadPNG(1024, true)">Download PNG 1024px (Square)</button>
  </div>

  <script>
    function getSvgData(square) {
      const svg = document.getElementById('app-icon').cloneNode(true);
      if (square) {
        const clipRect = svg.querySelector('#iosClip rect');
        if (clipRect) {
          clipRect.setAttribute('rx', '0');
          clipRect.setAttribute('ry', '0');
        }
      }
      return new XMLSerializer().serializeToString(svg);
    }

    function downloadSVG(square) {
      const svgData = getSvgData(square);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = square ? 'cleanjobtracker-icon-square.svg' : 'cleanjobtracker-icon.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function downloadPNG(size, square) {
      const svgData = getSvgData(square);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'cleanjobtracker-icon-' + size + (square ? '-square' : '') + '.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
