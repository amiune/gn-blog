<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Orders — App Icon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #FAFBFF;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    p { color: #475569; margin-bottom: 2rem; font-size: 0.95rem; }
    .icon-wrap { margin-bottom: 2rem; filter: drop-shadow(0 8px 24px rgba(37,99,235,0.25)); }
    .icon-wrap svg { display: block; width: 256px; height: 256px; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #2563EB; color: #fff; }
    .btn-secondary { background: #E2E8F0; color: #1E293B; }
  </style>
</head>
<body>
  <h1>SB Orders</h1>
  <p>App Icon</p>

  <div class="icon-wrap">
    <svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <!-- Background -->
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Kanban board -->
        <rect x="220" y="220" width="584" height="624" rx="48" fill="#fff"/>

        <!-- Board header -->
        <rect x="280" y="272" width="464" height="28" rx="14" fill="#2563EB" opacity="0.16"/>

        <!-- Column lanes -->
        <rect x="276" y="332" width="140" height="454" rx="24" fill="#EFF6FF"/>
        <rect x="442" y="332" width="140" height="454" rx="24" fill="#EEF2FF"/>
        <rect x="608" y="332" width="140" height="454" rx="24" fill="#E0E7FF"/>

        <!-- Column labels -->
        <rect x="308" y="360" width="76" height="14" rx="7" fill="#2563EB" opacity="0.35"/>
        <rect x="474" y="360" width="76" height="14" rx="7" fill="#4F46E5" opacity="0.35"/>
        <rect x="640" y="360" width="76" height="14" rx="7" fill="#4338CA" opacity="0.35"/>

        <!-- To do cards -->
        <rect x="292" y="406" width="108" height="92" rx="18" fill="#fff"/>
        <rect x="308" y="430" width="62" height="12" rx="6" fill="#2563EB" opacity="0.2"/>
        <rect x="308" y="452" width="80" height="10" rx="5" fill="#2563EB" opacity="0.14"/>
        <circle cx="374" cy="474" r="8" fill="#60A5FA"/>

        <rect x="292" y="522" width="108" height="118" rx="18" fill="#fff"/>
        <rect x="308" y="548" width="72" height="12" rx="6" fill="#2563EB" opacity="0.2"/>
        <rect x="308" y="570" width="82" height="10" rx="5" fill="#2563EB" opacity="0.14"/>
        <rect x="308" y="590" width="64" height="10" rx="5" fill="#2563EB" opacity="0.14"/>
        <circle cx="374" cy="616" r="8" fill="#60A5FA"/>

        <!-- In progress cards -->
        <rect x="458" y="406" width="108" height="110" rx="18" fill="#fff"/>
        <rect x="474" y="432" width="66" height="12" rx="6" fill="#4F46E5" opacity="0.2"/>
        <rect x="474" y="454" width="78" height="10" rx="5" fill="#4F46E5" opacity="0.14"/>
        <rect x="474" y="474" width="60" height="10" rx="5" fill="#4F46E5" opacity="0.14"/>
        <circle cx="540" cy="500" r="8" fill="#818CF8"/>

        <rect x="458" y="540" width="108" height="92" rx="18" fill="#fff"/>
        <rect x="474" y="564" width="62" height="12" rx="6" fill="#4F46E5" opacity="0.2"/>
        <rect x="474" y="586" width="82" height="10" rx="5" fill="#4F46E5" opacity="0.14"/>
        <circle cx="540" cy="608" r="8" fill="#818CF8"/>

        <!-- Done cards -->
        <rect x="624" y="406" width="108" height="92" rx="18" fill="#fff"/>
        <rect x="640" y="430" width="64" height="12" rx="6" fill="#4338CA" opacity="0.2"/>
        <rect x="640" y="452" width="78" height="10" rx="5" fill="#4338CA" opacity="0.14"/>
        <circle cx="706" cy="474" r="8" fill="#34D399"/>

        <rect x="624" y="522" width="108" height="92" rx="18" fill="#fff"/>
        <rect x="640" y="546" width="68" height="12" rx="6" fill="#4338CA" opacity="0.2"/>
        <rect x="640" y="568" width="70" height="10" rx="5" fill="#4338CA" opacity="0.14"/>
        <circle cx="706" cy="590" r="8" fill="#34D399"/>
      </g>
    </svg>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
    <button class="btn-secondary" onclick="downloadPNG(1024)">Download PNG 1024px</button>
  </div>

  <p style="margin-top: 2rem;">Without rounded corners</p>
  <div class="actions">
    <button class="btn-primary" onclick="downloadSVG(true)">Download SVG (Square)</button>
    <button class="btn-secondary" onclick="downloadPNG(1024, true)">Download PNG 1024px (Square)</button>
  </div>

  <script>
    function getSvgData(square) {
      const svg = document.getElementById('app-icon').cloneNode(true);
      if (square) {
        const clipRect = svg.querySelector('#iosClip rect');
        if (clipRect) {
          clipRect.setAttribute('rx', '0');
          clipRect.setAttribute('ry', '0');
        }
      }
      return new XMLSerializer().serializeToString(svg);
    }

    function downloadSVG(square) {
      const svgData = getSvgData(square);
      const blob = new Blob([svgData], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = square ? 'sborders-icon-square.svg' : 'sborders-icon.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function downloadPNG(size, square) {
      const svgData = getSvgData(square);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'sborders-icon-' + size + (square ? '-square' : '') + '.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
