<svg id="app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4A8899"/>
          <stop offset="100%" stop-color="#2A5565"/>
        </linearGradient>
        <clipPath id="iosClip">
          <rect width="1024" height="1024" rx="224" ry="224"/>
        </clipPath>
      </defs>

      <g clip-path="url(#iosClip)">
        <rect width="1024" height="1024" fill="url(#bg)"/>

        <!-- Three stacked inventory boxes -->
        <g stroke="#1F4655" stroke-width="6" stroke-linejoin="round" fill-rule="nonzero">
          <rect x="282" y="610" width="460" height="150" rx="22" fill="#F4A261"/>
          <rect x="282" y="437" width="460" height="150" rx="22" fill="#E9C46A"/>
          <rect x="282" y="264" width="460" height="150" rx="22" fill="#A8DADC"/>

          <line x1="342" y1="655" x2="682" y2="655" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
          <line x1="342" y1="482" x2="682" y2="482" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
          <line x1="342" y1="309" x2="682" y2="309" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
        </g>
      </g>
    </svg>